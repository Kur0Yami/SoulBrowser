name: Build Soul2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip python3

      - name: Build APK
        env:
          SOUL_PACKAGE_ID: net.kaki87.soul2.testing
          SOUL_APP_NAME: SoulBrowser
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: List APK
        run: |
          echo "=== APK OUTPUT ==="
          ls -lh dist/
          file dist/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulBrowser-APK
          path: dist/*.apk
          if-no-files-found: error

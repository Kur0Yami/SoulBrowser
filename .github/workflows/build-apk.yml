name: Build SoulBrowser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip unzip python3

      - name: Build APK
        env:
          SOUL_PACKAGE_ID: net.kaki87.soul2.testing
          SOUL_APP_NAME: SoulBrowser
        run: |
          chmod +x scripts/*.sh
          ./scripts/build.sh

      - name: Show build output
        run: |
          echo "=== BUILD OUTPUT ==="
          ls -lh dist/
          echo
          file dist/*.apk

      - name: Prepare final APK
        run: |
          mkdir -p final

          FINAL_APK=$(find dist -maxdepth 1 -type f \
            -name 'soul-browser-*.apk' \
            ! -name '*-unsigned.apk' \
            ! -name '*-aligned.apk' \
            ! -name '*-merged-unsigned.apk' \
            | head -n 1)

          if [ -z "$FINAL_APK" ]; then
            echo "ERROR: Final signed APK not found!"
            exit 1
          fi

          echo "Final APK:"
          echo "$FINAL_APK"

          cp "$FINAL_APK" final/SoulBrowser.apk

          echo
          echo "=== FINAL APK ==="
          ls -lh final/SoulBrowser.apk
          file final/SoulBrowser.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: SoulBrowser
          path: final/SoulBrowser.apk
          if-no-files-found: error
